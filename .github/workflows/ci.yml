name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: ["**"] }

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: healthemr
          POSTGRES_PASSWORD: healthemr
          POSTGRES_DB: healthemr
        ports: ["5455:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://healthemr:healthemr@localhost:5455/healthemr?schema=public
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      PHI_ENCRYPTION_KEY: Y2ktb25seS1rZXktMzJieXRlcy1sb25nLXBhZGRpbmch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:seed
      - run: npm test
      - run: npm run test:e2e -w @health-emr/api
      - run: npm run build
